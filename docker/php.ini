display_errors = Off
error_reporting = E_ALL & ~E_DEPRECATED
log_errors = On
error_log = /proc/self/fd/2
memory_limit = 256M
expose_php = Off
; The image is immutable, so PHP files never change under a running container.
opcache.validate_timestamps = 0
opcache.memory_consumption = 64
; Set the public scheme from Caddy (see prepend.php).
auto_prepend_file = /usr/local/lib/prepend.php
; PHP2Shell (CVE-2026-109618/109619): the fix is PHP >= 8.4.27, this is extra hardening. The app does not use upload progress.
session.upload_progress.enabled = 0
