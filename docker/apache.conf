# dbwebb.se behind Caddy. Same rules as config/docker/dbwebb.se.conf, adapted to Apache 2.4 and a container.

# The real client address comes from Caddy (needed for the spambot rules in config/apache-env).
RemoteIPHeader X-Forwarded-For
RemoteIPTrustedProxy 127.0.0.1 172.16.0.0/12

# Anax builds absolute URLs from SERVER_NAME, SERVER_PORT and REQUEST_SCHEME. Behind Caddy the container listens on 8080
# and sees plain http, so present (in the vhost) the public name and port 80.
ServerName dbwebb.se

ServerSignature Off
ServerTokens Prod

<VirtualHost *:8080>
    ServerName dbwebb.se:80
    UseCanonicalName On
    DocumentRoot /app/htdocs
    ErrorLog  /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined

    Include /app/config/apache-env
    Include /app/config/apache-redirects
    Include /app/config/apache-rewrites

    <Directory /app/htdocs>
        AllowOverride None
        <RequireAll>
            Require all granted
            Require not env spambot
        </RequireAll>
        # Directory listings are on at dbwebb.se today (/img/, /download/), kept.
        Options +Indexes +FollowSymLinks

        # Rewrite to frontcontroller
        RewriteEngine on
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule .* index.php [NC,L]
    </Directory>
</VirtualHost>
